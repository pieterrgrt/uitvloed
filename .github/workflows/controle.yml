name: Controle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            server/package-lock.json
      - name: Site bouwen
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Server testen
        working-directory: server
        run: |
          npm ci
          npm test
