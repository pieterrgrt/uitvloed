<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uitvloed</title>
  <meta name="description" content="Uitvloed — een kleine, onafhankelijke uitgeverij-werkplaats.">
  <style>
    :root { --bg: #faf8f4; --fg: #1f1d1a; --muted: #6b665e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171614; --fg: #ece8e1; --muted: #9a948a; }
    }
    html { background: var(--bg); color: var(--fg); }
    body {
      margin: 0 auto; max-width: 36rem; padding: 18vh 1rem 4rem;
      font: 1.125rem/1.6 Georgia, "Times New Roman", serif;
    }
    h1 { font-weight: normal; font-size: 2.5rem; letter-spacing: .02em; margin: 0 0 1rem; }
    p { margin: 0 0 1rem; }
    footer { margin-top: 4rem; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Uitvloed</h1>
  <p>Een kleine, onafhankelijke uitgeverij-werkplaats waar boeken van manuscript tot gedrukte pagina worden gemaakt.</p>
  <p>Binnenkort meer.</p>
  <footer>uitvloed.nl</footer>
</body>
</html>
